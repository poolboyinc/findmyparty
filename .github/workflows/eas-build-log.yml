name: EAS build log

# Prints an EAS build's log into this job's log. Run it with the build id from a failed build:
#   gh workflow run eas-build-log.yml -f build_id=<id> [-f phase=INSTALL_PODS]
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build id
        required: true
      phase:
        description: Only this build phase (empty for the failed phases, or everything)
        required: false
        default: ''

jobs:
  log:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FindMyParty/src/Clients/FindMyParty.MobileApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.FMP_SECRET }}
      - name: Print the log
        env:
          BUILD_ID: ${{ inputs.build_id }}
          PHASE: ${{ inputs.phase }}
        run: |
          eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build.json"
          node -e '
            const b = require(process.argv[1]);
            console.error("status:", b.status, "| error:", JSON.stringify(b.error || null), "| log files:", (b.logFiles || []).length);
            for (const url of b.logFiles || []) console.log(url);
          ' "$RUNNER_TEMP/build.json" > "$RUNNER_TEMP/urls.txt"
          while read -r url; do
            curl -sL "$url" > "$RUNNER_TEMP/log.txt"
            echo "log bytes: $(wc -c < "$RUNNER_TEMP/log.txt")"
            node -e '
              const text = require("fs").readFileSync(process.argv[1], "utf8");
              const want = process.env.PHASE;
              const rows = [];
              for (const line of text.split("\n")) {
                if (!line.trim()) continue;
                try { rows.push(JSON.parse(line)); } catch { rows.push({ msg: line }); }
              }
              const failed = new Set(rows.filter(r => r.result === "fail" && r.phase).map(r => r.phase));
              console.log("phases:", [...new Set(rows.map(r => r.phase).filter(Boolean))].join(", "));
              console.log("failed phases:", [...failed].join(", ") || "(none marked)");
              const pick = want ? new Set([want]) : failed;
              const out = rows.filter(r => pick.size === 0 || pick.has(r.phase)).map(r => (r.phase ? "[" + r.phase + "] " : "") + (r.msg ?? JSON.stringify(r)));
              console.log(out.slice(-250).join("\n"));
            ' "$RUNNER_TEMP/log.txt"
          done < "$RUNNER_TEMP/urls.txt"
