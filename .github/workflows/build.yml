name: EAS Build

on:
  workflow_dispatch:
  push:
    branches:
      - home-pc-setup
    paths:
      - 'FindMyParty/src/Clients/FindMyParty.MobileApp/eas.json'
      - 'FindMyParty/src/Clients/FindMyParty.MobileApp/app.json'

jobs:
  build:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FindMyParty/src/Clients/FindMyParty.MobileApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FindMyParty/src/Clients/FindMyParty.MobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.FMP_SECRET }}

      - name: Build (iOS development)
        run: eas build --platform ios --profile development --non-interactive

      # When the cloud build fails, copy the failing phase of Expo's build log into this job's log,
      # so the reason is readable here without signing in to expo.dev.
      - name: Show why the EAS build failed
        if: failure()
        run: |
          eas build:list --platform ios --limit 1 --json --non-interactive > last-build.json
          node -e '
            const [b] = require("./last-build.json");
            console.log("Build", b.id, b.status, "error:", JSON.stringify(b.error || null));
            for (const url of b.logFiles || []) console.log(url);
          ' > build-info.txt
          head -1 build-info.txt
          tail -n +2 build-info.txt | while read -r url; do
            curl -sL "$url" | node -e '
              const lines = require("fs").readFileSync(0, "utf8").split("\n");
              const failed = new Set();
              const rows = [];
              for (const l of lines) {
                try { const j = JSON.parse(l); rows.push(j); if (j.result === "fail" && j.phase) failed.add(j.phase); } catch {}
              }
              const phases = failed.size ? failed : new Set(["INSTALL_PODS"]);
              for (const j of rows) if (phases.has(j.phase) && j.msg) console.log("[" + j.phase + "]", j.msg);
            ' | tail -150
          done
