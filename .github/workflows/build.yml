name: EAS Build

on:
  workflow_dispatch:
  push:
    branches:
      - home-pc-setup
    paths:
      - 'FindMyParty/src/Clients/FindMyParty.MobileApp/eas.json'
      - 'FindMyParty/src/Clients/FindMyParty.MobileApp/app.json'

jobs:
  build:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FindMyParty/src/Clients/FindMyParty.MobileApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FindMyParty/src/Clients/FindMyParty.MobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.FMP_SECRET }}

      - name: Build (iOS development)
        run: eas build --platform ios --profile development --non-interactive
