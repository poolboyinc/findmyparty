name: EAS Build

on:
  workflow_dispatch:
    inputs:
      log_of_build:
        description: Leave empty to build. An EAS build id prints that build's log instead.
        required: false
        default: ''
  push:
    branches:
      - home-pc-setup
    paths:
      - 'FindMyParty/src/Clients/FindMyParty.MobileApp/eas.json'
      - 'FindMyParty/src/Clients/FindMyParty.MobileApp/app.json'

jobs:
  build:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FindMyParty/src/Clients/FindMyParty.MobileApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FindMyParty/src/Clients/FindMyParty.MobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.FMP_SECRET }}

      - name: Build (iOS development)
        if: ${{ !inputs.log_of_build }}
        run: eas build --platform ios --profile development --non-interactive

      # When the cloud build fails (or a build id is given), copy the failed phases of that build's log
      # into this job's log, so the reason is readable here without signing in to expo.dev.
      - name: Show the EAS build log
        if: ${{ failure() || inputs.log_of_build }}
        env:
          BUILD_ID: ${{ inputs.log_of_build }}
        run: |
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID=$(eas build:list --platform ios --limit 1 --json --non-interactive | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8"))[0].id)')
          fi
          eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build.json"
          node -e '
            const b = require(process.argv[1]);
            console.error("build:", b.id, "| status:", b.status, "| error:", JSON.stringify(b.error || null), "| log files:", (b.logFiles || []).length);
            for (const url of b.logFiles || []) console.log(url);
          ' "$RUNNER_TEMP/build.json" > "$RUNNER_TEMP/urls.txt"
          while read -r url; do
            curl -sL --compressed -D "$RUNNER_TEMP/headers.txt" "$url" > "$RUNNER_TEMP/log.raw"
            grep -iE "^(content-type|content-encoding):" "$RUNNER_TEMP/headers.txt" || true
            # Fallback for an encoding curl did not undo: try brotli, gzip and raw deflate in Node.
            node -e '
              const fs = require("fs"), zlib = require("zlib"), f = process.argv[1];
              const raw = fs.readFileSync(f);
              for (const [name, fn] of [["brotli", zlib.brotliDecompressSync], ["gzip", zlib.gunzipSync], ["deflate", zlib.inflateSync], ["raw deflate", zlib.inflateRawSync]]) {
                try { const out = fn(raw); if (out.length) { fs.writeFileSync(f, out); console.log("decoded with", name); break; } } catch {}
              }
            ' "$RUNNER_TEMP/log.raw"
            # The log may come as a tar archive and/or gzip-compressed; unpack whatever it is.
            echo "log file type: $(file -b "$RUNNER_TEMP/log.raw")"
            rm -rf "$RUNNER_TEMP/logx" && mkdir -p "$RUNNER_TEMP/logx"
            if tar -tf "$RUNNER_TEMP/log.raw" >/dev/null 2>&1; then tar -xf "$RUNNER_TEMP/log.raw" -C "$RUNNER_TEMP/logx"; else cp "$RUNNER_TEMP/log.raw" "$RUNNER_TEMP/logx/log"; fi
            : > "$RUNNER_TEMP/log.txt"
            find "$RUNNER_TEMP/logx" -type f | sort | while read -r f; do
              echo "contains: ${f#$RUNNER_TEMP/logx/} ($(file -b "$f"))"
              if gzip -t "$f" 2>/dev/null; then gunzip -c "$f"; elif tar -tf "$f" >/dev/null 2>&1; then tar -xOf "$f"; else cat "$f"; fi >> "$RUNNER_TEMP/log.txt"
            done
            echo "log bytes: $(wc -c < "$RUNNER_TEMP/log.txt")"
            node -e '
              const text = require("fs").readFileSync(process.argv[1], "utf8");
              const rows = [];
              for (const line of text.split("\n")) {
                if (!line.trim()) continue;
                try { rows.push(JSON.parse(line)); } catch { rows.push({ msg: line }); }
              }
              const failed = new Set(rows.filter(r => r.result === "fail" && r.phase).map(r => r.phase));
              console.log("phases:", [...new Set(rows.map(r => r.phase).filter(Boolean))].join(", "));
              console.log("failed phases:", [...failed].join(", ") || "(none marked)");
              const out = rows.filter(r => failed.size === 0 || failed.has(r.phase)).map(r => (r.phase ? "[" + r.phase + "] " : "") + (r.msg ?? JSON.stringify(r)));
              console.log(out.slice(-250).join("\n"));
            ' "$RUNNER_TEMP/log.txt"
          done < "$RUNNER_TEMP/urls.txt"
