version: '3.9'

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: fmp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fmp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fmp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ── Gateway ──────────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./Gateway/FindMyParty.ApiGateway
      dockerfile: Dockerfile
    container_name: fmp-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ServiceUrls__Identity=http://identity-api:8080
      - ServiceUrls__Parties=http://parties-api:8080
      - ServiceUrls__Bookings=http://bookings-api:8080
    depends_on:
      - identity-api
      - parties-api
      - bookings-api
    restart: unless-stopped

  # ── Services ────────────────────────────────────────────────────────────────

  identity-api:
    build:
      context: ./Services/Identity/FindMyParty.Identity.API
      dockerfile: Dockerfile
    container_name: fmp-identity
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${IDENTITY_DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  parties-api:
    build:
      context: ./Services/Parties/FindMyParty.Parties.API
      dockerfile: Dockerfile
    container_name: fmp-parties
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${PARTIES_DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - PartyPublisher__HostName=rabbitmq
      - PartyPublisher__UserName=${RABBITMQ_USER:-guest}
      - PartyPublisher__Password=${RABBITMQ_PASS:-guest}
      - PartyPublisher__ExchangeName=party.events
      - Redis__ConnectionString=redis:6379
      - AWS__Region=${AWS_REGION:-eu-north-1}
      - AWS__AccessKey=${AWS_ACCESS_KEY:-}
      - AWS__SecretKey=${AWS_SECRET_KEY:-}
      - AWS__S3__BucketName=${AWS_S3_BUCKET:-findmyparty-images}
    volumes:
      - parties_images:/app/wwwroot/images
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  bookings-api:
    build:
      context: ./Services/Bookings/FindMyParty.Bookings.API
      dockerfile: Dockerfile
    container_name: fmp-bookings
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${BOOKINGS_DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - Services__PartiesBaseUrl=http://parties-api:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      parties-api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  parties_images:
