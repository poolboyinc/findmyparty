<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: #0D0D0D; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        .party-pin {
            width: 38px;
            height: 38px;
            background-color: #7C3AED;
            border: 2.5px solid white;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(124, 58, 237, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .party-pin:hover {
            transform: rotate(-45deg) scale(1.15);
            box-shadow: 0 5px 16px rgba(124, 58, 237, 0.7);
        }
        .party-pin.sold-out {
            background-color: #555;
            box-shadow: none;
        }

        .mapboxgl-popup-content {
            background: #1A1A1A;
            color: white;
            border-radius: 10px;
            padding: 12px 16px;
            min-width: 160px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .mapboxgl-popup-tip { border-top-color: #1A1A1A !important; }
        .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; font-family: sans-serif; }
        .popup-price { color: #A78BFA; font-size: 13px; font-family: sans-serif; }
        .popup-date  { color: #888; font-size: 12px; margin-top: 3px; font-family: sans-serif; }
        .popup-sold  { color: #EF4444; font-size: 11px; margin-top: 3px; font-family: sans-serif; font-weight: 600; }

        .user-location-dot {
            width: 18px;
            height: 18px;
            background: #4A9EFF;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(74, 158, 255, 0.5);
            animation: userPulse 2s infinite;
        }
        @keyframes userPulse {
            0%   { box-shadow: 0 0 0 0   rgba(74, 158, 255, 0.5); }
            70%  { box-shadow: 0 0 0 12px rgba(74, 158, 255, 0);   }
            100% { box-shadow: 0 0 0 0   rgba(74, 158, 255, 0);   }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        mapboxgl.accessToken = '%%MAPBOX_TOKEN%%';

        var initialLat      = %%CENTER_LAT%%;
        var initialLng      = %%CENTER_LNG%%;
        var hasUserLocation = %%HAS_LOCATION%%;
        var initialParties  = %%PARTIES_DATA%%;

        var map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [initialLng, initialLat],
            zoom: 13
        });

        map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

        var markers = [];
        var userMarker = null;

        function showUserLocation(lat, lng) {
            var el = document.createElement('div');
            el.className = 'user-location-dot';
            if (userMarker) { userMarker.remove(); }
            userMarker = new mapboxgl.Marker(el)
                .setLngLat([lng, lat])
                .addTo(map);
        }

        function filterParties(dateStr) {
            if (!dateStr) {
                addPartyMarkers(initialParties);
                return;
            }
            var target = new Date(dateStr).toDateString();
            var filtered = initialParties.filter(function(p) {
                return new Date(p.startsAt).toDateString() === target;
            });
            addPartyMarkers(filtered);
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        function addPartyMarkers(parties) {
            markers.forEach(function(m) { m.remove(); });
            markers = [];

            parties.forEach(function(party) {
                var el = document.createElement('div');
                el.className = party.isSoldOut ? 'party-pin sold-out' : 'party-pin';

                var priceText = party.isSoldOut
                    ? '<div class="popup-sold">SOLD OUT</div>'
                    : '<div class="popup-price">€' + Number(party.price).toFixed(2) + '</div>';

                var popup = new mapboxgl.Popup({ offset: 28, closeButton: false })
                    .setHTML(
                        '<div class="popup-title">' + escapeHtml(party.title) + '</div>' +
                        priceText +
                        '<div class="popup-date">' + new Date(party.startsAt).toLocaleDateString() + '</div>'
                    );

                var marker = new mapboxgl.Marker(el)
                    .setLngLat([party.longitude, party.latitude])
                    .setPopup(popup)
                    .addTo(map);

                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    window.location.href = 'fmp://partyTapped?id=' + party.id;
                });

                markers.push(marker);
            });
        }

        function centerMap(lat, lng, zoom) {
            map.flyTo({ center: [lng, lat], zoom: zoom || 13, duration: 1500 });
        }

        function refreshParties(partiesJson) {
            addPartyMarkers(JSON.parse(partiesJson));
        }

        map.on('load', function() {
            if (initialParties && initialParties.length > 0) {
                addPartyMarkers(initialParties);
            }
            if (hasUserLocation) {
                showUserLocation(initialLat, initialLng);
            }
        });
    </script>
</body>
</html>
